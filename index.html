<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ladybug AI Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐞</text></svg>" type="image/svg+xml" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1f1f2e;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #2d2d44;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background-color: #4e7fff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background-color: #383851;
    }

    #inputArea {
      display: flex;
      padding: 12px;
      background-color: #2d2d44;
      border-top: 1px solid #444;
    }

    #userInput {
      flex: 1;
      padding: 10px 16px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1em;
      background-color: #3a3a55;
      color: white;
    }

    #sendBtn {
      margin-left: 12px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #4e7fff;
      color: white;
      font-size: 1em;
      cursor: pointer;
    }

    #sendBtn:hover {
      background-color: #3b65d8;
    }
  </style>
</head>
<body>

  <header>🐞 Ladybug AI</header>

  <main id="chat"></main>

  <div id="inputArea">
    <input id="userInput" type="text" placeholder="Type your message..." onkeydown="if(event.key==='Enter') getResponse()" />
    <button id="sendBtn" onclick="getResponse()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const conversationHistory = [];

    // Replace with your OpenAI API key
    const OPENAI_API_KEY = 'YOUR_OPENAI_API_KEY_HERE';

    function addMessage(content, isUser = false) {
      const msg = document.createElement('div');
      msg.className = 'message ' + (isUser ? 'user' : 'bot');
      msg.textContent = content;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function getResponse() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      addMessage("Typing...", false);

      // Add user message to conversation history
      conversationHistory.push({
        role: 'user',
        content: text
      });

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              {
                role: 'system',
                content: 'You are Ladybug AI, a friendly, helpful, and knowledgeable AI assistant. You are smart, patient, and always ready to assist with any questions or tasks. You communicate in a warm, engaging, and professional manner.'
              },
              ...conversationHistory
            ],
            temperature: 0.7,
            max_tokens: 1500
          }),
        });

        const data = await response.json();
        chat.removeChild(chat.lastChild);

        if (data.error) {
          addMessage(`Error: ${data.error.message || "No response from AI."}`);
        } else {
          const aiResponse = data.choices[0].message.content;
          addMessage(aiResponse);
          
          // Add AI response to conversation history
          conversationHistory.push({
            role: 'assistant',
            content: aiResponse
          });
        }
      } catch (error) {
        chat.removeChild(chat.lastChild);
        addMessage("An error occurred while connecting to AI.");
        console.error('Error:', error);
      }
    }
  </script>

</body>
</html>
